name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check project files
        run: |
          echo "===== PROJECT ROOT ====="
          ls -la
          echo "===== APP FOLDER ====="
          ls -la app

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Get SHA-1 from APK
        run: |
          echo "========================================"
          echo "APK SIGNING CERTIFICATE"
          echo "========================================"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK found: $APK"
          echo ""

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found."
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"
          echo ""

          echo "Certificate fingerprints:"
          "$APKSIGNER" verify --print-certs "$APK"

          echo ""
          echo "========================================"
          echo "SHA-1 ONLY"
          echo "========================================"

          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1"

          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Zikr-Tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
