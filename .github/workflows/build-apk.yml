name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check project files
        run: |
          echo "===== PROJECT ROOT ====="
          ls -la
          echo "===== APP FOLDER ====="
          ls -la app

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Get Debug SHA-1
        run: |
          echo "========================================"
          echo "ANDROID DEBUG SHA-1"
          echo "========================================"

          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android | grep -E "SHA1:|SHA256:"
          else
            echo "debug.keystore was not found."
          fi

          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Zikr-Tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
