name: Get Android SHA

on:
  workflow_dispatch:

jobs:
  sha:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.config/android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.config/android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Get SHA-1
        run: |
          echo "=============================="
          echo "ANDROID DEBUG SHA-1"
          echo "=============================="

          keytool -list \
            -v \
            -keystore "$HOME/.config/android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey | grep -E "SHA1:|SHA256:"

          echo "=============================="
