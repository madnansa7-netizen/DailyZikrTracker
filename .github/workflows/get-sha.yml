name: Get Android SHA

on:
  workflow_dispatch:

jobs:
  sha:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.config/android"
          keytool -genkeypair \
            -v \
            -keystore "$HOME/.config/android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Get SHA-1
        run: gradle signingReport
